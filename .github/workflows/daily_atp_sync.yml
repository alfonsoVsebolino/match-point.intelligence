name: Hydrogen Offload Worker — Daily ATP Sync & Schedule Prediction

# Decoupled "Hydrogen" routine-task offload worker:
# Offloads heavy Kaggle dataset pulls, 68k+ rolling feature recomputations,
# data/player_state_cache.joblib refreshes, and batch ESPN schedule predictions
# out-of-band so the stateless Google Cloud Run web service remains fast.

on:
  schedule:
    # Runs daily at 06:00 UTC and 14:00 UTC as ATP daily draws & schedules publish
    - cron: "0 6,14 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional schedule date (YYYY-MM-DD)"
        required: false
        default: ""
      force_recompute:
        description: "Force feature recompute even if Kaggle CSV hash is unchanged"
        required: false
        default: "false"
      skip_kaggle:
        description: "Skip Kaggle dataset download and predict using cached state (--no-kaggle)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  hydrogen-daily-sync-and-predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hydrogen routine sync and batch schedule predictions
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.force_recompute }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.skip_kaggle }}" = "true" ]; then
            ARGS="$ARGS --no-kaggle"
          fi
          python pipeline/atp_daily_sync.py run-daily $ARGS

      - name: Verify sync status and fixture summary
        run: |
          python -c "from pipeline import atp_data; print('sync_status:', atp_data.get_sync_status()); print('fixtures_count:', len(atp_data.get_daily_predictions().get('fixtures', [])))"

      - name: Upload daily prediction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atp-daily-predictions
          path: |
            data/daily_predictions_latest.json
            data/daily_predictions_latest.csv
            data/predictions_history/
            data/sync_state.json

      - name: Commit refreshed features and predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            test_features.csv \
            match_scores.csv \
            data/sync_state.json \
            data/daily_predictions_latest.json \
            data/daily_predictions_latest.csv \
            data/predictions_history \
            data/player_state_cache.joblib; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): daily ATP Kaggle sync and schedule predictions [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

      # Optional Cloud Run refresh/redeploy trigger once refreshed artifacts are pushed.
      # Configure repository variable vars.CLOUD_RUN_DEPLOY_HOOK (and optional secret CLOUD_RUN_HOOK_TOKEN)
      # to notify or trigger a Cloud Run build/refresh endpoint; skipped cleanly when unset.
      - name: Trigger optional Cloud Run deploy or schedule refresh webhook
        if: ${{ vars.CLOUD_RUN_DEPLOY_HOOK != '' }}
        env:
          CLOUD_RUN_DEPLOY_HOOK: ${{ vars.CLOUD_RUN_DEPLOY_HOOK }}
          CLOUD_RUN_HOOK_TOKEN: ${{ secrets.CLOUD_RUN_HOOK_TOKEN }}
        run: |
          if [ -n "$CLOUD_RUN_HOOK_TOKEN" ]; then
            curl -fsSL -X POST -H "Authorization: Bearer $CLOUD_RUN_HOOK_TOKEN" "$CLOUD_RUN_DEPLOY_HOOK"
          else
            curl -fsSL -X POST "$CLOUD_RUN_DEPLOY_HOOK"
          fi
